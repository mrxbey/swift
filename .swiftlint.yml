# SwiftLint Configuration
# For HabitTracker - Enterprise Swift Project

# Paths to include/exclude
included:
  - HabitTracker/Sources
  - HabitTracker/Tests

excluded:
  - Pods
  - HabitTracker/.build
  - HabitTracker/Supabase

# Disabled rules
disabled_rules:
  - todo
  - trailing_whitespace
  - line_length  # We'll set a custom value

# Opt-in rules (best practices)
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - required_enum_case
  - single_test_class
  - sorted_first_last
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

# Rule configurations

line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 10
  error: 20
  ignores_case_statements: true

nesting:
  type_level:
    warning: 3
    error: 6
  statement_level:
    warning: 5
    error: 10

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - db
    - to
    - at
    - by
    - on
    - tz
    - rpc
    - url
    - api
    - dto
    - ui

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60

file_header:
  required_pattern: |
                    \/\/
                    \/\/ .*\.swift
                    \/\/ HabitTracker
                    \/\/

# Custom rules
custom_rules:
  # Discourage force unwrapping
  no_force_unwrapping:
    name: "Force Unwrapping"
    regex: "\\!(?!\\=)"
    match_kinds:
      - identifier
    message: "Avoid force unwrapping. Use optional binding or guard instead."
    severity: warning

  # Require mark comments in extensions
  mark_extensions:
    name: "MARK in Extensions"
    regex: "^extension\\s+\\w+(?:\\s*:\\s*\\w+)?\\s*\\{[^\\n]*\\n(?!\\s*\\/\\/\\s*MARK)"
    message: "Extensions should have a MARK comment"
    severity: warning

  # Prefer async/await over completion handlers
  async_await_preferred:
    name: "Prefer async/await"
    regex: "\\@escaping\\s*\\([^)]*\\)\\s*->\\s*Void"
    message: "Consider using async/await instead of completion handlers"
    severity: warning

# Analyzer rules (requires full build)
analyzer_rules:
  - unused_declaration
  - unused_import

# Reporter type
reporter: "xcode"
